name: Payroll mail transport tests

on:
  push:
    branches:
      - feat/brevo-payroll-https-20261010
  pull_request:
    paths:
      - 'erp/modules/payroll/**'
      - 'test_payroll_brevo.py'
      - 'test_payroll_mail_worker.py'
      - 'test_payroll_reissue.py'
      - 'test_payroll_web_dispatch.py'
      - 'test_staff_accounts.py'
      - 'test_http.py'
      - 'erp/modules/identity/**'
      - 'erp/application/queries.py'
      - 'erp/presentation/http.py'
      - 'test_apps_script_ping.py'
      - 'test_apps_script_pdf.py'
      - 'test_apps_script_worker.py'
      - 'test_apps_script_render_demo.py'
      - 'wsgi.py'
      - 'integrations/google-apps-script/**'

permissions:
  contents: read

jobs:
  payroll-mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF engine
        run: python -m pip install reportlab==4.4.9 pypdf==6.1.3
      - name: Verify offline payroll email unit tests
        env:
          ERP_PAYROLL_MAIL_ENABLED: 'false'
          ERP_PAYROLL_MAIL_PROVIDER: smtp
        run: python -m unittest test_payroll_brevo.py test_payroll_mail_worker.py test_payroll_reissue.py test_payroll_web_dispatch.py test_staff_accounts.py test_http.py test_payroll_pdf.py test_apps_script_ping.py test_apps_script_pdf.py test_apps_script_worker.py test_apps_script_render_demo.py -v
