name: Backend full audit suite

on:
  pull_request:
    paths:
      - 'erp/**'
      - 'server.py'
      - 'wsgi.py'
      - 'print_agent.py'
      - 'migrate_data.py'
      - 'supabase/**'
      - 'requirements.txt'
      - 'test_*.py'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/backend-quality.yml'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned application dependencies and PDF test reader
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pypdf==6.1.3
      - name: Syntax and module compilation
        run: python -m compileall -q erp server.py wsgi.py print_agent.py migrate_data.py
      - name: Backend and isolated integration tests
        env:
          ERP_ENV: test
          ERP_PAYROLL_MAIL_ENABLED: 'false'
          ERP_APPS_SCRIPT_REAL_DELIVERY_ENABLED: 'false'
        run: python -m unittest discover -p 'test_*.py' -v
